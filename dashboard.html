<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>Dashboard</title>
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="stylesheet" href="css/dashboard.css?v=3">
</head>
<body>

<main class="login" id="login">
  <form class="login-card" id="login-form">
    <h1>Dashboard</h1>
    <p>Private. Enter the password to continue.</p>
    <label class="sr" for="pw">Password</label>
    <input class="field" id="pw" type="password" autocomplete="current-password" placeholder="Password" required>
    <button class="btn" id="login-btn" type="submit">Log in</button>
    <p class="msg" id="login-msg" role="status" aria-live="polite"></p>
  </form>
</main>

<div class="wrap" id="app" hidden>
  <header class="top">
    <h1>Dashboard</h1>
    <button class="btn btn--ghost" id="logout" type="button">Log out</button>
  </header>

  <section class="block" aria-labelledby="h-sug">
    <h2 id="h-sug">Suggestions</h2>
    <div class="tools">
      <span class="count" id="count"></span>
      <input class="field" id="search" type="search" placeholder="Search suggestions or names" aria-label="Search suggestions or names">
      <button class="btn btn--ghost" id="export" type="button">Export CSV</button>
    </div>
    <ul class="list" id="list"></ul>
    <p class="note">Newest first. The most recent 500 are kept.</p>
  </section>

  <section class="block" aria-labelledby="h-rx">
    <h2 id="h-rx">Reaction game stats</h2>
    <div class="stats">
      <div class="stat"><b id="rx-plays">–</b><span>Total plays</span></div>
      <div class="stat"><b id="rx-avg">–</b><span>Everyone's average time</span></div>
      <div class="stat"><b id="rx-fast">–</b><span>Fastest time ever</span><small id="rx-fast-at"></small></div>
    </div>
  </section>
  <p class="msg" id="app-msg" role="status" aria-live="polite"></p>
</div>

<script src="js/dashboard.js?v=1"></script>
</body>
</html>
